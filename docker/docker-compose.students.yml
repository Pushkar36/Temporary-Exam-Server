# =============================================================================
# TEMPLATE COMMENT — DO NOT REMOVE
# =============================================================================
# The pattern above repeats for student-container-4 through student-container-N
# where N = STUDENT_COUNT passed to create-containers.sh
#
# Port allocation:
#   student-container-N → host port (8000 + N) → container port 8080
#
# The dynamic generator (scripts/create-containers.sh) uses this file as a
# template and uses sed/envsubst to replace variables for each student:
#
#   TEMPLATE VARS per student:
#   ${SEQ}          → Student sequence number (1-based)
#   ${STUDENT_ID}   → Unique student identifier
#   ${STUDENT_NAME} → Full student name
#   ${STUDENT_ROLL} → Roll number
#   ${STUDENT_EMAIL}→ Student email
#   ${EXAM_ID}      → Exam identifier (e.g., EXAM-2026-A1B2)
#   ${HOST_PORT}    → Host port (8000 + SEQ)
# =============================================================================
