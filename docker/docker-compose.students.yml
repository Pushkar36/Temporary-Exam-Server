# =============================================================================
# docker-compose.students.yml — Student Container Template
# =============================================================================
# This file is DYNAMICALLY GENERATED by scripts/create-containers.sh
# Do NOT edit manually — your changes will be overwritten at exam start.
#
# Template shows 3 example student containers (student-container-1 through 3).
# In production, this file will contain one service per enrolled student,
# with unique ports allocated starting from BASE_STUDENT_PORT (default: 8001).
#
# To start student containers:
#   docker-compose -f docker-compose.yml -f docker-compose.students.yml up -d
#
# To scale dynamically:
#   ./scripts/create-containers.sh --count 50 --exam-id EXAM-2026-A1B2
# =============================================================================

version: '3.8'

# =============================================================================
# Use the shared network created by docker-compose.yml
# =============================================================================
networks:
  exam-network:
    external: true
    name: exam-network

# =============================================================================
# Use shared volumes for submissions and logs
# =============================================================================
volumes:
  submissions:
    external: true
    name: exam-submissions
  logs:
    external: true
    name: exam-logs

# =============================================================================
# STUDENT CONTAINERS
# =============================================================================
# Naming convention : student-container-{N}
# Port convention   : HOST_PORT = 8000 + N   (e.g., student 1 → 8001)
# Student ID format : STU-{EXAM_ID}-{N:04d}  (e.g., STU-A1B2-0001)
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # Student Container 1
  # Student: Aarav Sharma | Roll: 26CS1001
  # Host Port: 8001  →  Container Port: 8080
  # ---------------------------------------------------------------------------
  student-container-1:
    image: exam-student-env:latest
    container_name: exam-student-1
    hostname: student-1
    restart: "no"                      # Never auto-restart exam containers
    ports:
      - "8001:8080"                   # Unique host port per student
    environment:
      # ── Student Identity ────────────────────────────────────────────────
      - STUDENT_ID=STU-A1B2-0001
      - STUDENT_NAME=Aarav Sharma
      - STUDENT_ROLL=26CS1001
      - STUDENT_EMAIL=aarav.sharma@institution.edu
      # ── Exam Configuration ──────────────────────────────────────────────
      - EXAM_ID=EXAM-2026-A1B2
      - EXAM_NAME=Data Structures and Algorithms - Mid Semester
      - EXAM_LANGUAGE=python
      - EXAM_DURATION=180              # Minutes
      - EXAM_START_TIME=2026-05-20T09:00:00+05:30
      - EXAM_END_TIME=2026-05-20T12:00:00+05:30
      # ── Container Config ────────────────────────────────────────────────
      - CONTAINER_PORT=8080
      - STUDENT_SEQUENCE=1
      - MAX_FILE_SIZE_MB=50
      - ALLOWED_IMPORTS=numpy,pandas,collections,itertools,functools,math,sys,os
    volumes:
      # Mount student-specific submissions directory
      - submissions:/exam/submissions
      # Mount logs (read-write for student container logs)
      - logs:/exam/logs
      # tmpfs for /tmp — in-memory, auto-cleared (no persistent sensitive data)
    tmpfs:
      - /tmp:size=64m,mode=1777
    networks:
      - exam-network
    # ── Resource Limits ────────────────────────────────────────────────────
    # Prevents any single student from monopolizing host resources
    deploy:
      resources:
        limits:
          cpus: '0.5'                  # Max 50% of 1 CPU core
          memory: 512M                 # Max 512 MB RAM
        reservations:
          cpus: '0.1'                  # Guarantee 10% CPU
          memory: 128M                 # Guarantee 128 MB RAM
    # ── Security ───────────────────────────────────────────────────────────
    security_opt:
      - no-new-privileges:true         # Prevent privilege escalation
    cap_drop:
      - ALL                            # Drop all Linux capabilities
    cap_add:
      - CHOWN                          # Allow file ownership changes
      - SETUID                         # Allow setuid (for student user)
      - SETGID                         # Allow setgid (for student group)
    read_only: false                   # Workspace needs write access
    # ── Health Check ───────────────────────────────────────────────────────
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    # ── Metadata Labels ────────────────────────────────────────────────────
    labels:
      com.exam.student.id: "STU-A1B2-0001"
      com.exam.student.name: "Aarav Sharma"
      com.exam.exam.id: "EXAM-2026-A1B2"
      com.exam.container.type: "student"
      com.exam.container.port: "8001"
    # ── Ulimits ────────────────────────────────────────────────────────────
    ulimits:
      nproc: 100                       # Max processes (prevent fork bombs)
      nofile:
        soft: 1024
        hard: 2048
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
        tag: "student-1-{{.ID}}"

