# ==============================================================================
# Nginx Configuration for Temporary Exam Server Generator
# ==============================================================================

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Rate limiting zone
    limit_req_zone $binary_remote_addr zone=exam_limit:10m rate=10r/s;

    # ==============================================================================
    # Admin Dashboard & Main Site
    # ==============================================================================
    server {
        listen       80;
        server_name  examcloud.local;

        # Redirect HTTP to HTTPS in production
        # return 301 https://$host$request_uri;

        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
        }

        # API backend reverse proxy
        location /api/ {
            proxy_pass http://backend-api:3000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_addrs;
        }
    }

    # ==============================================================================
    # Dynamic Student Routing (Template)
    # The actual upstreams would be generated dynamically by a script or API gateway
    # ==============================================================================
    
    # upstream student_1 {
    #     server ctn-1:8080;
    # }
    
    # upstream student_2 {
    #     server ctn-2:8080;
    # }

    server {
        listen 8080;
        server_name student.examcloud.local;

        # location /student/1/ {
        #     proxy_pass http://student_1/;
        #     proxy_http_version 1.1;
        #     proxy_set_header Upgrade $http_upgrade;
        #     proxy_set_header Connection "upgrade";
        #     limit_req zone=exam_limit burst=20 nodelay;
        # }
    }
}
